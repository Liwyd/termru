# cargo-deny configuration: license + advisory + source policy gates for CI.
# Run: cargo deny check
#
# Policy notes:
# * Versions are pinned by the committed `Cargo.lock`; therefore a wildcard
#   requirement in a manifest is reported as a warning, not an error.
# * Unmaintained-crate advisories are only fatal for **direct** workspace
#   dependencies; a transitive unmaintained crate is informational and is
#   tracked in `docs/security/dependency-review.md`.
# * Every advisory ignore carries a reason and an expiry date, so it has to
#   be revisited instead of silently accepted.

[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
ignore = [
    # rsa is pulled in by russh's `ssh-key` (RSA host-key and user-key
    # support). No fixed release exists: russh 0.64.1 is the latest and still
    # uses ssh-key 0.7.0-rc.11 -> rsa 0.10.0-rc.18. The Marvin attack needs
    # precise timing measurements of our own RSA private-key operations; RSA
    # user authentication is not used by default and the client-side impact is
    # limited to a local attacker. Revisit when russh updates ssh-key.
    # Review by 2027-01-01.
    { id = "RUSTSEC-2023-0071", reason = "transitive via russh/ssh-key; no fixed release available; review by 2027-01-01" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
