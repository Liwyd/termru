# cargo-deny configuration: license + advisory + source policy gates for CI.
# Run: cargo deny check
#
# Policy notes:
# * Versions are pinned by the committed `Cargo.lock`; therefore a wildcard
#   requirement in a manifest is reported as a warning, not an error.
# * Unmaintained-crate advisories are only fatal for **direct** workspace
#   dependencies; a transitive unmaintained crate is informational and is
#   tracked in `docs/security/dependency-review.md`.
# * Every advisory ignore carries a reason and an expiry date, so it has to
#   be revisited instead of silently accepted.

[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
ignore = [
    # chrono is flagged "unmaintained" (informational, no vulnerability) and
    # has no patched release. It is a direct workspace dependency (core, store,
    # cloud server, desktop) and `tokio-postgres` maps its timestamp types onto
    # it, so it cannot be dropped in a security patch. Plan: evaluate migrating
    # to `jiff` or `time`; tracked in TODO.md and
    # docs/security/dependency-review.md. Review by 2027-03-01.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (informational); no safe upgrade; migration to jiff/time to be evaluated; review by 2027-03-01" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
