[package]
name = "termru-cloud-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Termru self-hosted sync API (Axum + PostgreSQL)"

[lib]
name = "termru_cloud_server"
path = "src/lib.rs"

[[bin]]
name = "termru-cloud-server"
path = "src/main.rs"

[dependencies]
termru-core = { workspace = true }
axum = { version = "0.8", features = ["json", "macros", "http1", "http2", "tokio"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
# `sqlx` can not be used here: its optional sqlite driver links the native
# library `sqlite3`, which the desktop app already links through `rusqlite`,
# and cargo allows only one package per `links` value. `tokio-postgres` plus
# `deadpool-postgres` provide the same capabilities without a native
# library. See docs/architecture/0003-persistence-split.md.
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
