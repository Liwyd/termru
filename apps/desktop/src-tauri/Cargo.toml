[package]
name = "termru-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Termru desktop application (Tauri shell)"

[lib]
name = "termru_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tokio = { workspace = true }
termru-core = { workspace = true }
termru-store = { workspace = true }
termru-ssh = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
# HTTP client for the cloud sync API. The rustls backend with the native
# trust store: a self-hosted server with a private certificate works, and no
# OpenSSL or cmake is needed to build it.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
    "charset",
    "system-proxy",
] }
uuid = { workspace = true }
keyring = "4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
