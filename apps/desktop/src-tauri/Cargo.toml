tracing-appender = { workspace = true }
tokio = { workspace = true }
termru-core = { workspace = true }
termru-store = { workspace = true }
termru-ssh = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
uuid = { workspace = true }
keyring = "4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
