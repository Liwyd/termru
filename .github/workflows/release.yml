name: Release

# The release pipeline is only triggered by a version tag. It never runs for
# a pull request, and it never sees the publishing secrets of an untrusted
# build.
#
# The pipeline:
#   1. validates the tag (semver, and the version must match the manifests),
#   2. runs the tests,
#   3. builds the desktop packages on three platforms,
#   4. builds the cloud server image,
#   5. writes the checksums and the release assets,
#   6. verifies that everything landed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build (for example v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  verify:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image_tags: ${{ steps.version.outputs.image_tags }}
      image_repo: ${{ steps.version.outputs.image_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is a semver and matches the manifests
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "the tag '$tag' is not a semantic version" >&2
            exit 1
          fi
          # The registry only accepts a lowercase repository name.
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/${owner}/termru-cloud"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"
          for manifest in Cargo.toml apps/desktop/src-tauri/tauri.conf.json; do
            if ! grep -q "\"$version\"" "$manifest" && ! grep -q "version = \"$version\"" "$manifest"; then
              echo "the version $version does not match $manifest" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A prerelease never becomes the 'latest' tag: the stable tag
          # points at the last stable release only.
          if printf '%s' "$version" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            {
              echo "image_tags<<EOF"
              echo "$image_repo:$version"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            {
              echo "image_tags<<EOF"
              echo "$image_repo:$version"
              echo "$image_repo:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "the tag $tag is valid"

  test:
    name: Tests
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termru
          POSTGRES_PASSWORD: termru
          POSTGRES_DB: termru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termru -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TERMRU_TEST_DATABASE_URL: postgres://termru:termru@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target

      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server

      # The backup test of the cloud server runs `pg_dump` and
      # `pg_restore`: they have to be the version of the server, or they
      # refuse the dump ("server version mismatch").
      - name: Install the PostgreSQL client of the server version
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      # The desktop app needs the system libraries of the webview.
      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Format
        run: cargo fmt --check

      # The whole workspace: the desktop app is a member too, and the
      # libraries it needs are installed above.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The desktop sync client against the real cloud server.
      - name: Sync end-to-end test
        env:
          TERMRU_CLOUD_SERVER_BIN: ${{ github.workspace }}/target/debug/termru-cloud-server
        run: |
          cargo build -p termru-cloud-server --bin termru-cloud-server
          cargo test -p termru-desktop --test sync_e2e

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  desktop:
    name: Desktop package (${{ matrix.label }})
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: deb
            os: ubuntu-22.04
            args: --bundles deb
          - label: appimage
            os: ubuntu-22.04
            args: --bundles appimage
          # There is no Fedora image among the GitHub-hosted runners, so
          # the RPM is built on Debian. The bundler writes it itself (the
          # Rust crate `rpm`); the `rpm` tools are only installed to query
          # it. The dependencies of the RPM are the Fedora ones, they are
          # declared in `tauri.conf.json`.
          - label: rpm
            os: ubuntu-22.04
            args: --bundles rpm
          - label: nsis
            os: windows-latest
            args: --bundles nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the build dependencies (Debian, Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            fuse \
            libfuse2 \
            file

      - name: Install the dependencies
        run: npm ci

      # The RPM format has no room for a prerelease version (the version
      # may not contain a dash), so the RPM is only built for a stable
      # release.
      - name: Build the packages
        if: matrix.label != 'rpm' || needs.verify.outputs.prerelease == 'false'
        working-directory: apps/desktop
        # The `--` is what separates the arguments of npm from the
        # arguments of the script: without it, npm eats `--bundles`.
        run: npm run tauri -- build ${{ matrix.args }} --ci

      # The bundler writes into the target directory of the cargo workspace.
      # It is located by searching instead of by a fixed path, so the pipeline
      # does not depend on where the bundler decides to put the files.
      - name: Locate the packages
        id: packages
        if: matrix.label != 'rpm' || needs.verify.outputs.prerelease == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          find . -path '*/target/release/bundle/*' \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' \) \
            -exec cp -v {} dist-artifacts/ \;
          ls -l dist-artifacts
          test -n "$(ls -A dist-artifacts)" || { echo "no package was built"; exit 1; }

      # The package has to be installable, not only buildable. The smoke
      # test installs it, queries the package manager and checks the
      # dependencies the package declares are the ones the system provides.
      - name: Install and query the package (${{ matrix.label }})
        if: (runner.os != 'Windows') && (matrix.label != 'rpm' || needs.verify.outputs.prerelease == 'false')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.label }}" in
            deb)
              package="$(ls dist-artifacts/*.deb)"
              sudo apt-get update
              # apt only takes a file when the path starts with ./ or /.
              sudo apt-get install -y "./$package"
              dpkg-query -W -f='${Package} ${Version}\n' termru
              # The declared dependencies must be satisfiable on the target.
              for dependency in libwebkit2gtk-4.1-0 libgtk-3-0; do
                dpkg-query -W -f='${Package} ${Status}\n' "$dependency"
              done
              ;;
            rpm)
              package="$(ls dist-artifacts/*.rpm)"
              # The package is queried, not installed: the runner has no
              # `dnf`. The metadata and the dependencies have to be right.
              rpm -qip "$package"
              rpm -qp --requires "$package"
              ;;
            appimage)
              appimage="$(ls dist-artifacts/*.AppImage)"
              chmod +x "$appimage"
              # The AppImage must be self-contained: it extracts without a
              # system installation.
              "$appimage" --appimage-extract >/dev/null
              test -x squashfs-root/AppRun
              rm -rf squashfs-root
              ;;
          esac

      - name: Check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-artifacts/*.exe
          if (-not $installer) { throw "no NSIS installer was built" }
          # The installer is an unsigned executable; check that it is a PE
          # binary and that it is not empty.
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "the installer is not a PE binary" }
          Write-Host "the installer is a PE binary of $($installer.Length) bytes"

      # The RPM of a prerelease does not exist (see above). The step is
      # skipped instead of uploading an empty artifact: the download of
      # the artifacts (which merges them) fails on an empty one.
      - name: Collect the artifacts
        if: matrix.label != 'rpm' || needs.verify.outputs.prerelease == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 7

  cloud-image:
    name: Cloud server image
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The image is built but not pushed: publishing needs the registry
      # credentials, which are not available to a tag build by default.
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: false
          load: true
          tags: termru-cloud:${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /bin/sh termru-cloud:${{ needs.verify.outputs.version }} -c \
            'test -x /usr/local/bin/termru-cloud-server && /usr/local/bin/termru-cloud-server --help >/dev/null 2>&1 || true'

  cloud-image-publish:
    name: Publish the cloud server image
    needs: [verify, test, cloud-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The image is published in the GitHub container registry, so the
      # pipeline needs no second set of credentials.
      packages: write
    env:
      IMAGE_REPO: ${{ needs.verify.outputs.image_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: true
          tags: ${{ needs.verify.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The list of tags is an environment variable, not text spliced into
      # the script: a stable release carries two tags, and the newline
      # between them would break the `for`.
      - name: Verify that the image is in the registry
        env:
          IMAGE_TAGS: ${{ needs.verify.outputs.image_tags }}
        run: |
          set -euo pipefail
          for tag in $IMAGE_TAGS; do
            digest="$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')"
            test -n "$digest" || { echo "the image $tag has no digest" >&2; exit 1; }
            echo "$tag -> $digest"
          done

  publish:
    name: Publish the release
    needs: [verify, test, desktop, cloud-image-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the packages: the build of the image leaves a `.dockerbuild`
      # record behind, and the download of the artifacts fails on it.
      - name: Download the artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      # The deployment files are released next to the packages: the install
      # guide downloads the compose file and verifies its checksum before it
      # starts anything.
      - name: Add the deployment files
        run: |
          set -euo pipefail
          cp apps/cloud-server/compose.yaml artifacts/compose.yaml
          # Not '.env.example': the upload action skips hidden files.
          cp apps/cloud-server/.env.example artifacts/termru-cloud.env.example
          cd artifacts
          sha256sum compose.yaml > compose.yaml.sha256
          cat compose.yaml.sha256

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # The release page shows the section of the changelog of the version.
      # The generated notes alone would only cover the commits since the
      # previous tag, which says nothing about a release.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { take = 1; next }
            take && /^## \[/ { take = 0 }
            take { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md             || { echo "the changelog has no section for $VERSION" >&2; exit 1; }
          cat RELEASE_NOTES.md

      - name: Upload the assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # A pre-release is marked as such: it is not the stable release.
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}

      - name: Verify that the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(gh release view "v${{ needs.verify.outputs.version }}" --json assets --jq '.assets | length')" \
            || { echo "the release was not created"; exit 1; }
          echo "the release holds $count assets"
          test "$count" -ge 5 || { echo "the release is missing assets"; exit 1; }
          gh release view "v${{ needs.verify.outputs.version }}" --json assets --jq '.assets[].name'
