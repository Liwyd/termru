name: Release

# The release pipeline is only triggered by a version tag. It never runs for
# a pull request, and it never sees the publishing secrets of an untrusted
# build.
#
# The pipeline:
#   1. validates the tag (semver, and the version must match the manifests),
#   2. runs the tests,
#   3. builds the desktop packages on three platforms,
#   4. builds the cloud server image,
#   5. writes the checksums and the release assets,
#   6. verifies that everything landed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build (for example v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  verify:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check that the tag is a semver and matches the manifests
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "the tag '$tag' is not a semantic version" >&2
            exit 1
          fi
          for manifest in Cargo.toml apps/desktop/src-tauri/tauri.conf.json; do
            if ! grep -q "\"$version\"" "$manifest" && ! grep -q "version = \"$version\"" "$manifest"; then
              echo "the version $version does not match $manifest" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the tag $tag is valid"

  test:
    name: Tests
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termru
          POSTGRES_PASSWORD: termru
          POSTGRES_DB: termru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termru -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TERMRU_TEST_DATABASE_URL: postgres://termru:termru@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: . -> target

      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  desktop:
    name: Desktop package (${{ matrix.label }})
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: deb
            os: ubuntu-22.04
            args: --bundles deb
          - label: appimage
            os: ubuntu-22.04
            args: --bundles appimage
          - label: rpm
            os: fedora-latest
            args: --bundles rpm
          - label: nsis
            os: windows-latest
            args: --bundles nsis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            fuse \
            file

      - name: Install the dependencies
        run: npm ci

      - name: Build the packages
        working-directory: apps/desktop
        run: npm run tauri build ${{ matrix.args }} -- --ci

      - name: Collect the artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  cloud-image:
    name: Cloud server image
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The image is built but not pushed: publishing needs the registry
      # credentials, which are not available to a tag build by default.
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: false
          load: true
          tags: termru-cloud:${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /bin/sh termru-cloud:${{ needs.verify.outputs.version }} -c \
            'test -x /usr/local/bin/termru-cloud-server && /usr/local/bin/termru-cloud-server --help >/dev/null 2>&1 || true'

  publish:
    name: Publish the release
    needs: [verify, test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download the artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Verify that the release is complete
        run: |
          set -euo pipefail
          gh release view "${{ needs.verify.outputs.version }}" --json assets --jq '.assets | length' \
            || { echo "the release was not created"; exit 1; }
