name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep the CI artifact small: debug info is not needed for CI builds.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install OpenSSH server (for the SSH integration tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sshd -V || true

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  server:
    name: Cloud server (clippy, tests with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termru
          POSTGRES_PASSWORD: termru
          POSTGRES_DB: termru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termru -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The integration tests create and drop their own databases in this
      # server; without the variable they skip with a loud message.
      TERMRU_TEST_DATABASE_URL: postgres://termru:termru@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Clippy
        run: cargo clippy -p termru-cloud-server --all-targets -- -D warnings

      - name: Test
        run: cargo test -p termru-cloud-server

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  desktop:
    name: Desktop app (compile check, sync end-to-end)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termru
          POSTGRES_PASSWORD: termru
          POSTGRES_DB: termru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termru -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TERMRU_TEST_DATABASE_URL: postgres://termru:termru@127.0.0.1:5432/postgres
      TERMRU_CLOUD_SERVER_BIN: ${{ github.workspace }}/target/debug/termru-cloud-server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend bundle
        run: npm run build

      - name: Compile the desktop binary
        run: cargo build -p termru-desktop

      - name: Build the cloud server binary
        run: cargo build -p termru-cloud-server --bin termru-cloud-server

      # The desktop sync client against the real cloud server: register, push
      # a host, pull it back on a second device.
      - name: Sync end-to-end test
        run: cargo test -p termru-desktop --test sync_e2e

  container:
    name: Cloud server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image is built, not published: the release pipeline does that.
      - name: Build the cloud server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: false
          load: true
          tags: termru-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect the image
        run: |
          docker image inspect termru-cloud:ci --format '{{ .Config.User }} {{ json .Config.Healthcheck }}'
          # The image must not contain a build toolchain or the sources.
          docker run --rm --entrypoint /bin/sh termru-cloud:ci -c \
            'command -v cargo && exit 1 || true; command -v rustc && exit 1 || true; test -x /usr/local/bin/termru-cloud-server'

  supply-chain:
    name: Supply chain (deny, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: cargo-deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
