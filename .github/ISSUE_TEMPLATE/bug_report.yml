name: Bug report
description: Report a problem with Termru
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug, including what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including server/platform details if relevant.
      placeholder: |
        1. Open host '…'
        2. Run '…'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Termru version / commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS (experimental)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log excerpts (no secrets, host keys, or credentials).
      render: shell
